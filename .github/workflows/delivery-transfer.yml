name: Delivery artifact transfer
on:
  workflow_run:
    workflows: [Delivery CI]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  transfer:
    if: github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion == 'success'
    uses: waksana/cockpit/.github/workflows/shared-delivery-transfer.yml@0f6e2e136df9a40d15376f23b0a5aec808d018ef
    with:
      run_id: ${{ format('{0}', github.event.workflow_run.id) }}
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

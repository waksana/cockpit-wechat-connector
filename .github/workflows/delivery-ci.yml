name: Module CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
  packages: read
jobs:
  build:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@waksana'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: npm run build && npm test && npm run pack:module
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-native-module
          path: waksana-cockpit-wechat-connector-*.tgz
          if-no-files-found: error
